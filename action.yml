name: OPC Orchestration Core
description: Run one scheduler-independent OPC control command
inputs:
  command:
    description: validated OPC control or local execution command
    required: true
  repository:
    description: owner/name of the caller repository
    required: true
  issue-number:
    description: optional Work or Recovery Issue number
    required: false
  workflow-ref:
    description: caller default branch used for explicit workflow dispatch
    required: false
  failure-payload-b64:
    description: base64url-encoded bounded failure evidence for recover
    required: false
  payload-b64:
    description: base64url-encoded immutable execution or heartbeat envelope
    required: false
  input-file:
    description: absolute runner-temp path to structured model output
    required: false
  codex-version:
    description: exact host-installed Codex CLI version
    required: false
  permission-profile:
    description: host-owned opc-executor or opc-reviewer profile
    required: false
  github-token:
    description: repository-scoped GitHub Actions token
    required: false
outputs:
  result-json:
    description: schema-validated JSON command result
  claimed:
    description: true when this run obtained the repository claim
  issue-number:
    description: claimed Work or Recovery Issue number
  attempt:
    description: current bounded attempt number
  base-sha:
    description: approved immutable base commit
  envelope-b64:
    description: base64url-encoded immutable execution envelope
  heartbeat-payload-b64:
    description: base64url-encoded heartbeat watch inputs
  codex-bin:
    description: verified absolute Codex CLI path
  workspace:
    description: isolated execution worktree
  prompt-file:
    description: mode-0600 immutable prompt path
  executor-schema-file:
    description: commit-pinned executor JSON schema path
  review-schema-file:
    description: commit-pinned result-review JSON schema path
  bundle-ready:
    description: true only when a Candidate Result bundle is complete
  bundle-directory:
    description: verified Candidate Result bundle directory
runs:
  using: node24
  main: dist/action/index.cjs
