name: OPC Orchestration Core
description: Run one scheduler-independent OPC control command
inputs:
  command:
    description: validated OPC control or local execution command
    required: true
  repository:
    description: owner/name of the caller repository
    required: true
  issue-number:
    description: optional Work or Recovery Issue number
    required: false
  payload-b64:
    description: base64url-encoded immutable execution or heartbeat envelope
    required: false
  input-file:
    description: absolute runner-temp path to structured model output
    required: false
  codex-version:
    description: exact host-installed Codex CLI version
    required: false
  artifact-sha256:
    description: trusted outer bundle-index digest from finalize-execution
    required: false
  enabled:
    description: repository execution kill switch, must be exactly true
    required: false
  workspace:
    description: verified workspace used by the pinned Codex route
    required: false
  prompt-file:
    description: mode-0600 prompt file under runner temp
    required: false
  output-file:
    description: structured Codex output file under runner temp
    required: false
  schema-file:
    description: commit-pinned JSON schema inside this Action
    required: false
  timeout-seconds:
    description: fixed reviewer timeout in seconds
    required: false
  deadline-epoch-ms:
    description: absolute approved executor wall-clock deadline
    required: false
  codex-outcome:
    description: trusted run-codex outcome passed to final cleanup
    required: false
  reported-outcome:
    description: fixed workflow-owned failure category to report
    required: false
  permission-profile:
    description: host-owned opc-executor or opc-reviewer profile
    required: false
  github-token:
    description: repository-scoped GitHub Actions token
    required: false
outputs:
  result-json:
    description: schema-validated JSON command result
  claimed:
    description: true when this run obtained the repository claim
  issue-number:
    description: claimed Work or Recovery Issue number
  attempt:
    description: current bounded attempt number
  base-sha:
    description: approved immutable base commit
  envelope-b64:
    description: base64url-encoded immutable execution envelope
  heartbeat-payload-b64:
    description: base64url-encoded heartbeat watch inputs
  codex-bin:
    description: verified absolute Codex CLI path
  codex-home:
    description: verified host-owned Codex home used by the CLI
  workspace:
    description: isolated execution worktree
  prompt-file:
    description: mode-0600 immutable prompt path
  executor-schema-file:
    description: commit-pinned executor JSON schema path
  review-schema-file:
    description: commit-pinned result-review JSON schema path
  deadline-epoch-ms:
    description: absolute approved executor wall-clock deadline
  codex-outcome:
    description: completed work-failure or run-incident
  finalize-outcome:
    description: completed work-failure or run-incident after cleanup
  bundle-ready:
    description: true only when a Candidate Result bundle is complete
  bundle-directory:
    description: verified Candidate Result bundle directory
  artifact-sha256:
    description: outer Candidate Result bundle-index digest
  outcome:
    description: deterministic Evidence Gate or production completion outcome
runs:
  using: node24
  main: dist/action/index.cjs
