name: OPC Reusable Delivery
on:
  workflow_call:
    inputs:
      event_name:
        required: true
        type: string
      issue_number:
        required: false
        type: string

jobs:
  dispatch-and-claim:
    runs-on: ubuntu-latest
    concurrency:
      group: opc-control-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      actions: write
    outputs:
      claimed: ${{ steps.opc.outputs.claimed }}
      issue_number: ${{ steps.opc.outputs['issue-number'] }}
      attempt: ${{ steps.opc.outputs.attempt }}
      base_sha: ${{ steps.opc.outputs['base-sha'] }}
      envelope_b64: ${{ steps.opc.outputs['envelope-b64'] }}
      heartbeat_payload_b64: ${{ steps.opc.outputs['heartbeat-payload-b64'] }}
    steps:
      - name: Claim or reconcile
        id: opc
        uses: "0xroylee/OPC@10acb74a05dbfca611132940f505929c47c3761f"
        with:
          command: ${{ inputs.event_name == 'schedule' && 'reconcile' || 'claim' }}
          repository: ${{ github.repository }}
          issue-number: ${{ inputs.issue_number }}
          github-token: ${{ github.token }}

  heartbeat:
    needs: dispatch-and-claim
    if: needs.dispatch-and-claim.outputs.claimed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 195
    permissions:
      contents: read
      actions: read
    steps:
      - name: Watch executor and reviewer liveness
        uses: "0xroylee/OPC@10acb74a05dbfca611132940f505929c47c3761f"
        with:
          command: heartbeat
          repository: ${{ github.repository }}
          issue-number: ${{ needs.dispatch-and-claim.outputs.issue_number }}
          payload-b64: ${{ needs.dispatch-and-claim.outputs.heartbeat_payload_b64 }}
          github-token: ${{ github.token }}

  execute-gate:
    needs: dispatch-and-claim
    if: needs.dispatch-and-claim.outputs.claimed == 'true' && vars.OPC_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Recheck current Repository Policy before execute
        uses: "0xroylee/OPC@10acb74a05dbfca611132940f505929c47c3761f"
        with:
          command: policy-gate
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          enabled: ${{ vars.OPC_ENABLED }}

  execute:
    needs: [dispatch-and-claim, execute-gate]
    if: needs.dispatch-and-claim.outputs.claimed == 'true' && needs.execute-gate.result == 'success'
    runs-on: [self-hosted, macOS, ARM64, opc]
    timeout-minutes: 95
    permissions:
      contents: read
    outputs:
      artifact_sha256: ${{ steps.finalize.outputs['artifact-sha256'] }}
    env:
      OPC_BUNDLE_DIR: ${{ runner.temp }}/opc-bundle-${{ github.run_id }}
      OPC_WORKTREE_ROOT: ${{ runner.temp }}/opc-worktrees/${{ github.run_id }}
    steps:
      - name: Establish approved execution deadline
        id: deadline
        uses: "0xroylee/OPC@10acb74a05dbfca611132940f505929c47c3761f"
        with:
          command: execution-deadline
          repository: ${{ github.repository }}
          issue-number: ${{ needs.dispatch-and-claim.outputs.issue_number }}
          payload-b64: ${{ needs.dispatch-and-claim.outputs.envelope_b64 }}
          enabled: ${{ vars.OPC_ENABLED }}
      - name: Checkout target without persistent credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.dispatch-and-claim.outputs.base_sha }}
          path: target-source
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare execution workspace
        id: prepare
        uses: "0xroylee/OPC@10acb74a05dbfca611132940f505929c47c3761f"
        with:
          command: prepare-execution
          repository: ${{ github.repository }}
          issue-number: ${{ needs.dispatch-and-claim.outputs.issue_number }}
          payload-b64: ${{ needs.dispatch-and-claim.outputs.envelope_b64 }}
          enabled: ${{ vars.OPC_ENABLED }}
          deadline-epoch-ms: ${{ steps.deadline.outputs['deadline-epoch-ms'] }}
      - name: Record Bootstrap Failure
        if: always() && steps.prepare.outputs['prepare-outcome'] == 'work-failure'
        uses: "0xroylee/OPC@10acb74a05dbfca611132940f505929c47c3761f"
        with:
          command: report-run-failure
          repository: ${{ github.repository }}
          reported-outcome: execution
      - name: Record Prepare Run Incident
        if: always() && steps.prepare.outputs['prepare-outcome'] == 'run-incident'
        uses: "0xroylee/OPC@10acb74a05dbfca611132940f505929c47c3761f"
        with:
          command: report-run-failure
          repository: ${{ github.repository }}
          reported-outcome: infrastructure
      - name: Execute approved milestone
        id: codex
        uses: "0xroylee/OPC@10acb74a05dbfca611132940f505929c47c3761f"
        with:
          command: run-codex
          repository: ${{ github.repository }}
          permission-profile: opc-executor
          workspace: ${{ steps.prepare.outputs.workspace }}
          prompt-file: ${{ steps.prepare.outputs['prompt-file'] }}
          output-file: ${{ runner.temp }}/opc-executor-output.json
          schema-file: ${{ steps.prepare.outputs['executor-schema-file'] }}
          deadline-epoch-ms: ${{ steps.deadline.outputs['deadline-epoch-ms'] }}
      - name: Build Candidate Result
        if: always() && steps.prepare.outcome == 'success'
        id: finalize
        uses: "0xroylee/OPC@10acb74a05dbfca611132940f505929c47c3761f"
        with:
          command: finalize-execution
          repository: ${{ github.repository }}
          issue-number: ${{ needs.dispatch-and-claim.outputs.issue_number }}
          payload-b64: ${{ needs.dispatch-and-claim.outputs.envelope_b64 }}
          input-file: ${{ runner.temp }}/opc-executor-output.json
          codex-outcome: ${{ steps.codex.outputs['codex-outcome'] || 'run-incident' }}
          deadline-epoch-ms: ${{ steps.deadline.outputs['deadline-epoch-ms'] }}
      - name: Record Executor Failure
        if: always() && steps.finalize.outputs['finalize-outcome'] == 'work-failure'
        uses: "0xroylee/OPC@10acb74a05dbfca611132940f505929c47c3761f"
        with:
          command: report-run-failure
          repository: ${{ github.repository }}
          reported-outcome: execution
      - name: Record Executor Run Incident
        if: always() && steps.finalize.outputs['finalize-outcome'] == 'run-incident'
        uses: "0xroylee/OPC@10acb74a05dbfca611132940f505929c47c3761f"
        with:
          command: report-run-failure
          repository: ${{ github.repository }}
          reported-outcome: infrastructure
      - name: Upload Candidate Result
        if: always() && steps.finalize.outputs['bundle-ready'] == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: opc-candidate-${{ github.run_id }}
          path: ${{ steps.finalize.outputs['bundle-directory'] }}
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 30

  review-gate:
    needs: [dispatch-and-claim, execute]
    if: needs.execute.result == 'success' && vars.OPC_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Recheck current Repository Policy
        uses: "0xroylee/OPC@10acb74a05dbfca611132940f505929c47c3761f"
        with:
          command: policy-gate
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          enabled: ${{ vars.OPC_ENABLED }}

  review:
    needs: [dispatch-and-claim, execute, review-gate]
    if: needs.execute.result == 'success' && needs.review-gate.result == 'success' && vars.OPC_ENABLED == 'true'
    runs-on: [self-hosted, macOS, ARM64, opc]
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      outcome: ${{ steps.decision.outputs.outcome }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: opc-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/opc-review-input
      - name: Verify bundle and prepare review input
        id: prepare-review
        uses: "0xroylee/OPC@10acb74a05dbfca611132940f505929c47c3761f"
        with:
          command: prepare-review
          repository: ${{ github.repository }}
          issue-number: ${{ needs.dispatch-and-claim.outputs.issue_number }}
          payload-b64: ${{ needs.dispatch-and-claim.outputs.envelope_b64 }}
          input-file: ${{ runner.temp }}/opc-review-input
          artifact-sha256: ${{ needs.execute.outputs.artifact_sha256 }}
      - name: Review candidate independently
        id: codex-review
        uses: "0xroylee/OPC@10acb74a05dbfca611132940f505929c47c3761f"
        with:
          command: run-codex
          repository: ${{ github.repository }}
          permission-profile: opc-reviewer
          workspace: ${{ runner.temp }}/opc-review-input
          prompt-file: ${{ steps.prepare-review.outputs['prompt-file'] }}
          output-file: ${{ runner.temp }}/opc-result-review.json
          schema-file: ${{ steps.prepare-review.outputs['review-schema-file'] }}
          timeout-seconds: 900
      - name: Record Review Failure
        if: always() && steps.codex-review.outputs['codex-outcome'] == 'work-failure'
        uses: "0xroylee/OPC@10acb74a05dbfca611132940f505929c47c3761f"
        with:
          command: report-run-failure
          repository: ${{ github.repository }}
          reported-outcome: review
      - name: Record Reviewer Run Incident
        if: always() && steps.codex-review.outputs['codex-outcome'] == 'run-incident'
        uses: "0xroylee/OPC@10acb74a05dbfca611132940f505929c47c3761f"
        with:
          command: report-run-failure
          repository: ${{ github.repository }}
          reported-outcome: infrastructure
      - name: Apply deterministic Evidence Gate
        if: steps.codex-review.outputs['codex-outcome'] == 'completed'
        id: decision
        uses: "0xroylee/OPC@10acb74a05dbfca611132940f505929c47c3761f"
        with:
          command: decide-result
          repository: ${{ github.repository }}
          issue-number: ${{ needs.dispatch-and-claim.outputs.issue_number }}
          payload-b64: ${{ needs.dispatch-and-claim.outputs.envelope_b64 }}
          input-file: ${{ runner.temp }}/opc-result-review.json
          artifact-sha256: ${{ needs.execute.outputs.artifact_sha256 }}
      - name: Upload reviewed candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opc-reviewed-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/opc-review-input
            ${{ runner.temp }}/opc-result-review.json
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 30

  conclude:
    needs: [dispatch-and-claim, heartbeat, execute, review]
    if: always() && !cancelled() && needs.dispatch-and-claim.outputs.claimed == 'true' && vars.OPC_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - name: Persist verified result or bounded Recovery
        uses: "0xroylee/OPC@10acb74a05dbfca611132940f505929c47c3761f"
        with:
          command: complete-run
          repository: ${{ github.repository }}
          issue-number: ${{ needs.dispatch-and-claim.outputs.issue_number }}
          payload-b64: ${{ needs.dispatch-and-claim.outputs.envelope_b64 }}
          github-token: ${{ github.token }}
          enabled: ${{ vars.OPC_ENABLED }}

  publish:
    needs: [dispatch-and-claim, execute, review, conclude]
    if: needs.review.result == 'success' && needs.conclude.result == 'success' && vars.OPC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      issues: write
      actions: read
      pull-requests: write
    steps:
      - name: Download exact reviewed candidate
        uses: actions/download-artifact@v4
        with:
          name: opc-reviewed-${{ github.run_id }}
          path: ${{ runner.temp }}/opc-reviewed
      - name: Checkout approved base without persistent credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.dispatch-and-claim.outputs.base_sha }}
          path: target-source
          persist-credentials: false
          fetch-depth: 0
      - name: Publish reviewed candidate
        uses: "0xroylee/OPC@10acb74a05dbfca611132940f505929c47c3761f"
        with:
          command: publish
          repository: ${{ github.repository }}
          issue-number: ${{ needs.dispatch-and-claim.outputs.issue_number }}
          payload-b64: ${{ needs.dispatch-and-claim.outputs.envelope_b64 }}
          input-file: ${{ runner.temp }}/opc-reviewed/opc-review-input
          review-file: ${{ runner.temp }}/opc-reviewed/opc-result-review.json
          artifact-sha256: ${{ needs.execute.outputs.artifact_sha256 }}
          workspace: ${{ github.workspace }}/target-source
          github-token: ${{ github.token }}
