name: OPC Unattended Delivery
on:
  issues:
    types: [labeled]
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      reason:
        required: true
        type: string
      issue_number:
        required: false
        type: string

concurrency:
  group: opc-${{ github.repository }}
  cancel-in-progress: false

jobs:
  opc:
    if: vars.OPC_ENABLED == 'true'
    permissions:
      contents: read
      issues: write
      actions: write
    uses: "{{control_owner}}/OPC/.github/workflows/reusable-opc.yml@{{control_workflow_sha}}"
    with:
      event_name: ${{ github.event_name }}
      issue_number: ${{ inputs.issue_number || github.event.issue.number || '' }}
      codex_version: "0.144.4"
      executor_model: "gpt-5.6-luna"
      executor_effort: "high"
